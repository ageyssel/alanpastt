<!DOCTYPE html>
<html lang="es">
<head>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categoría | Codimas SpA</title>
  <meta name="description" content="Categoría de productos Codimas SpA.">
  <link rel="shortcut icon" href="../public/images/codimas-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/css/style.css?v=20260923-audit-2">
</head>
<body data-category="">
  <div id="category-root"></div>
  <script>
    document.body.dataset.category=new URLSearchParams(location.search).get('slug')||'';
    const root=document.getElementById('category-root');
    const fixDynamicCategory=()=>{
      root.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(src.startsWith('public/'))img.setAttribute('src','../'+src)});
      document.querySelectorAll('link[rel*="icon"]').forEach(link=>{const href=link.getAttribute('href')||'';if(href.startsWith('public/'))link.setAttribute('href','../'+href)});
      root.querySelectorAll('.codimas-feature-category').forEach(a=>{const href=a.getAttribute('href')||'';if(/^[^/?#]+\.html$/.test(href)&&href!=='categoria.html'){a.href='categoria.html?slug='+encodeURIComponent(href.replace(/\.html$/,''))}});
      const h1=root.querySelector('h1');if(h1)document.title=`${h1.textContent.trim()} | Codimas SpA`;
      const desc=root.querySelector('.codimas-page-hero-copy .codimas-copy');const meta=document.querySelector('meta[name="description"]');if(desc&&meta)meta.setAttribute('content',desc.textContent.trim());
    };
    new MutationObserver(fixDynamicCategory).observe(root,{childList:true,subtree:true});
  </script>
  <script src="../src/js/catalog-data.js"></script>
  <script src="../src/js/category-page.js?v=20260923-audit-final-1"></script>
</body>
</html>
